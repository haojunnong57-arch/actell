name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          echo "## Available Xcode versions" >> $GITHUB_STEP_SUMMARY
          ls /Applications/ | grep -i xcode >> $GITHUB_STEP_SUMMARY
          if [ -d "/Applications/Xcode_27.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app
          elif ls /Applications/Xcode_27*.app 2>/dev/null; then
            XCODE_APP=$(ls -d /Applications/Xcode_27*.app | head -1)
            sudo xcode-select -s "$XCODE_APP"
          elif [ -d "/Applications/Xcode_26.6.app" ]; then
            echo "WARNING: No Xcode 27, falling back to Xcode 26.6" >> $GITHUB_STEP_SUMMARY
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "ERROR: No suitable Xcode found" >> $GITHUB_STEP_SUMMARY
            ls /Applications/ | grep -i xcode
            exit 1
          fi
          xcodebuild -version >> $GITHUB_STEP_SUMMARY
          xcrun --sdk iphoneos --show-sdk-version >> $GITHUB_STEP_SUMMARY

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version
          cargo --version

      - name: Generate Xcode project
        run: |
          python3 ios-app/scripts/generate_xcode_project.py -d

      - name: Resolve Swift Packages
        run: |
          source "$HOME/.cargo/env"
          xcodebuild -project ios-app/PhoneAgent.xcodeproj -scheme PhoneAgent -resolvePackageDependencies

      - name: Build for Device (unsigned)
        run: |
          source "$HOME/.cargo/env"
          set +e
          xcodebuild archive \
            -project ios-app/PhoneAgent.xcodeproj \
            -scheme PhoneAgent \
            -configuration Release \
            -archivePath build/PhoneAgent.xcarchive \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" > build_output.log 2>&1
          RC=$?
          echo "## Build exit: $RC" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -40 build_output.log
          exit 0

      - name: Package IPA
        run: |
          APP_PATH="build/PhoneAgent.xcarchive/Products/Applications/PhoneAgent.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No .app found at $APP_PATH"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r PhoneAgent-unsigned.ipa Payload
          ls -lh PhoneAgent-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-ipa
          path: build/PhoneAgent-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
