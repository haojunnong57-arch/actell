name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version

      - name: Generate Xcode project
        run: python3 ios-app/scripts/generate_xcode_project.py -d

      - name: Build for Device (unsigned)
        run: |
          source "$HOME/.cargo/env"
          set +e
          xcodebuild archive \
            -project ios-app/PhoneAgent.xcodeproj \
            -scheme PhoneAgent \
            -configuration Release \
            -archivePath build/PhoneAgent.xcarchive \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" > build_output.log 2>&1
          RC=$?
          echo "## Build exit: $RC" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Show error lines and surrounding context
          grep -n -i "error:" build_output.log | head -30 >> $GITHUB_STEP_SUMMARY
          echo "--- last 100 lines ---" >> $GITHUB_STEP_SUMMARY
          tail -100 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 build_output.log
          exit 0

      - name: Package IPA
        run: |
          APP_PATH="build/PhoneAgent.xcarchive/Products/Applications/PhoneAgent.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No .app found"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r PhoneAgent-unsigned.ipa Payload
          ls -lh PhoneAgent-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-ipa
          path: build/PhoneAgent-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
