[package]
name = "phoneagent-ncm-backend"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
[lib]
crate-type = ["rlib", "staticlib"]
[workspace]
members = ["vendor/idevice"]
[dependencies]
idevice = { path = "vendor/idevice", default-features = false, features = ["ring", "remote_pairing", "tunnel_tcp_stack", "display_stream", "mobile_image_mounter"] }
tokio = { version = "1.53", features = ["io-util", "rt", "sync", "time", "macros"] }
plist = "1.10"
uuid = { version = "1.24", features = ["v4"] }
crc32fast = "1.5"
# No protocol/debug tracing, including dependency tracing, can expose credentials or frames.
tracing = { version = "0.1.41", features = ["max_level_off", "release_max_level_off"] }
[dev-dependencies]
ed25519-dalek = "2.2"
[profile.release]
opt-level = "s"
codegen-units = 1
lto = "thin"
